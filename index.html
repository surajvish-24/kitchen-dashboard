const sBadge=s=>{if(!s)return'';if(/active/i.test(s))return'<span class="badge bg">Active</span>';if(/expir/i.test(s))return'<span class="badge br">Expiring</span>';return'<span class="badge ba">Future</span>';};

const getRent =(k,mi)=>k.rent?.months?.[mi]||0;
const getUtil =(k,mi)=>(k.utility||[]).reduce((s,u)=>s+(u.months?.[mi]||0),0);
const getWifi =k=>WC[k.name]||0;
const getSim  =k=>(k.sim||[]).length*300;
const getTotal=(k,mi)=>getRent(k,mi)+getUtil(k,mi)+getWifi(k)+getSim(k);

function render(){
  const q=document.getElementById('srch').value.toLowerCase();
  const mi=+document.getElementById('msel').value;
  const srt=document.getElementById('ssel').value;
  const mn=MOF[mi];
  let kits=DATA.filter(k=>!q||k.name.toLowerCase().includes(q));
  kits.sort((a,b)=>srt==='d'?getTotal(b,mi)-getTotal(a,mi):srt==='a'?getTotal(a,mi)-getTotal(b,mi):a.name.localeCompare(b.name));
  const grand=kits.reduce((s,k)=>s+getTotal(k,mi),0);
  const rentT=kits.reduce((s,k)=>s+getRent(k,mi),0);
  const utilT=kits.reduce((s,k)=>s+getUtil(k,mi),0);
  const wsT  =kits.reduce((s,k)=>s+getWifi(k)+getSim(k),0);
  const maxT =Math.max(...kits.map(k=>getTotal(k,mi)),1);

  document.getElementById('sums').innerHTML=[
    {l:`${mn} Total`,v:INR(grand),s:`${kits.filter(k=>getTotal(k,mi)>0).length} active kitchens`,c:'#1a1916'},
    {l:'Rent',v:INR(rentT),s:`${grand?Math.round(rentT/grand*100):0}% of spend`,c:'#2563eb'},
    {l:'Utilities',v:INR(utilT),s:`${grand?Math.round(utilT/grand*100):0}% of spend`,c:'#059669'},
    {l:'Wifi + SIM',v:INR(wsT),s:`${grand?Math.round(wsT/grand*100):0}% of spend`,c:'#7c3aed'},
  ].map(c=>`<div class="sum-card"><div class="sum-lbl">${c.l}</div><div class="sum-val" style="color:${c.c}">${c.v}</div><div class="sum-sub">${c.s}</div></div>`).join('');

  document.getElementById('grid').innerHTML=kits.map(k=>{
    const tot=getTotal(k,mi),pct=Math.round(tot/maxT*100);
    const rent=getRent(k,mi),util=getUtil(k,mi),wc=getWifi(k)+getSim(k);
    return`<div class="kcard${sel===k.name?' sel':''}" onclick="toggle('${k.name.replace(/'/g,"\\'")}')">
      <div class="kname"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${k.name}</span>${sBadge(k.rent?.status)}</div>
      <div class="ktot">${INR(tot)}</div><div class="ksub">${mn}</div>
      <div class="kbar-wrap"><div class="kbar-bg"><div class="kbar-fill" style="width:${pct}%"></div></div><span style="font-size:10px;color:#9e9b94">${pct}%</span></div>
      <div class="pills">
        ${rent?`<span class="pill pill-r">R ${INR(rent)}</span>`:''}
        ${util?`<span class="pill pill-u">U ${INR(util)}</span>`:''}
        ${wc?`<span class="pill pill-w">W+S ${INR(wc)}</span>`:''}
      </div>
    </div>`;
  }).join('');

  if(sel){const k=DATA.find(x=>x.name===sel);if(k)renderDetail(k,mi,mn);}
}

function toggle(name){
  sel=sel===name?null:name; atab='overview';
  if(!sel){document.getElementById('panel').style.display='none';}
  render();
  if(sel) setTimeout(()=>document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'start'}),40);
}

function switchTab(t){
  atab=t;
  document.querySelectorAll('.dtab').forEach(el=>el.classList.toggle('on',el.dataset.tab===t));
  document.querySelectorAll('.tpane').forEach(el=>el.style.display=el.dataset.pane===t?'block':'none');
}

function utilTbl(k,mi){
  if(!k.utility?.length||!k.utility.some(u=>u.months.some(v=>v>0))) return '<div class="no-data">No utility data recorded</div>';
  const rows=k.utility.filter(u=>u.months.some(v=>v>0));
  const tots=MO.map((_,i)=>rows.reduce((s,r)=>s+(r.months?.[i]||0),0));
  let h=`<div class="tbl-wrap"><table class="dtbl"><thead><tr><th>Meter/Provider</th>${MO.map((m,i)=>`<th class="${i===mi?'hi':''}">${m}</th>`).join('')}<th>Total</th></tr></thead><tbody>`;
  rows.forEach(r=>{const rT=r.months.reduce((s,v)=>s+v,0);h+=`<tr><td>${r.label||'—'}</td>${r.months.map((v,i)=>`<td class="${i===mi?'hi':''} ${!v?'z':''}">${v?INR(v):'—'}</td>`).join('')}<td>${INR(rT)}</td></tr>`;});
  h+='</tbody>';
  if(rows.length>1) h+=`<tfoot><tr><td style="font-family:'DM Sans',sans-serif">Total</td>${tots.map((v,i)=>`<td class="${i===mi?'hi':''}">${v?INR(v):'—'}</td>`).join('')}<td>${INR(tots.reduce((s,v)=>s+v,0))}</td></tr></tfoot>`;
  return h+'</table></div>';
}

function rentTbl(k,mi){
  if(!k.rent) return '<div class="no-data">No rental data</div>';
  const rT=(k.rent.months||[]).reduce((s,v)=>s+v,0);
  return`<div class="tbl-wrap"><table class="dtbl"><thead><tr><th>Tenant</th>${MO.map((m,i)=>`<th class="${i===mi?'hi':''}">${m}</th>`).join('')}<th>Total</th></tr></thead><tbody><tr><td>${k.rent.tenant||'—'}</td>${(k.rent.months||Array(12).fill(0)).map((v,i)=>`<td class="${i===mi?'hi':''} ${!v?'z':''}">${v?INR(v):'—'}</td>`).join('')}<td>${INR(rT)}</td></tr></tbody></table></div>`;
}

function renderDetail(k,mi,mn){
  const rent=getRent(k,mi),util=getUtil(k,mi),wc=getWifi(k),sc=getSim(k),total=rent+util+wc+sc;
  const pct=n=>total?Math.round(n/total*100):0;
  const p=document.getElementById('panel'); p.style.display='block';
  p.innerHTML=`<div class="panel">
    <div class="panel-hdr"><h2>${k.name}</h2>${sBadge(k.rent?.status)}<button class="close" onclick="sel=null;document.getElementById('panel').style.display='none';render()">✕</button></div>
    <div class="dtabs">
      ${['overview','rent','utility','wifi'].map(t=>`<button class="dtab${t===atab?' on':''}" data-tab="${t}" onclick="switchTab('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('')}
    </div>
    <div class="dbody">
      <div class="tpane" data-pane="overview" ${atab!=='overview'?'style="display:none"':''}>
        <div class="dg">
          <div>
            ${k.rent?.tenant?`<div class="erow"><span class="elbl">Tenant</span><span style="font-size:12px;max-width:56%;text-align:right">${k.rent.tenant}</span></div>`:''}
            <div class="erow"><span class="elbl">${mn} Rent</span><span class="eval">${INR(rent)}</span></div>
            <div class="erow"><span class="elbl">${mn} Utility</span><span class="eval">${INR(util)}</span></div>
            <div class="erow"><span class="elbl">Wifi est.</span><span class="eval">${INR(wc)}</span></div>
            <div class="erow"><span class="elbl">SIM est. (${(k.sim||[]).length} SIM)</span><span class="eval">${INR(sc)}</span></div>
            <div class="total-line"><span>Total — ${mn}</span><span>${INR(total)}</span></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">
              ${rent?`<span style="font-size:11px;padding:3px 8px;border-radius:4px;background:#eff6ff;color:#2563eb">Rent ${pct(rent)}%</span>`:''}
              ${util?`<span style="font-size:11px;padding:3px 8px;border-radius:4px;background:#f0fdf4;color:#059669">Utility ${pct(util)}%</span>`:''}
              ${wc?`<span style="font-size:11px;padding:3px 8px;border-radius:4px;background:#f3f0ff;color:#7c3aed">Wifi ${pct(wc)}%</span>`:''}
            </div>
          </div>
          <div>
            <div class="legend">
              <span><span class="leg-sq" style="background:#2563eb"></span>Rent</span>
              <span><span class="leg-sq" style="background:#059669"></span>Utility</span>
              <span><span class="leg-sq" style="background:#7c3aed"></span>Wifi+SIM</span>
            </div>
            <div class="chart-wrap"><canvas id="tchart"></canvas></div>
          </div>
        </div>
      </div>
      <div class="tpane" data-pane="rent" ${atab!=='rent'?'style="display:none"':''}>
        ${k.rent?.tenant?`<div class="erow"><span class="elbl">Tenant</span><span>${k.rent.tenant}</span></div>`:''}
        ${k.rent?.status?`<div class="erow"><span class="elbl">Status</span>${sBadge(k.rent.status)}</div>`:''}
        <div style="margin-top:10px">${rentTbl(k,mi)}</div>
      </div>
      <div class="tpane" data-pane="utility" ${atab!=='utility'?'style="display:none"':''}>${utilTbl(k,mi)}</div>
      <div class="tpane" data-pane="wifi" ${atab!=='wifi'?'style="display:none"':''}>
        <div class="sec-lbl">Wifi / Broadband</div>
        ${(k.wifi||[]).filter(w=>w.vendor&&w.vendor!=='—').length?(k.wifi||[]).map(w=>`<div class="ws-row"><span style="color:#6b6860">${w.vendor}</span><div style="display:flex;align-items:center;gap:7px"><span style="font-size:11px;color:#9e9b94">${fD(w.due)}</span>${dueBadge(w.due)}</div></div>`).join(''):'<div class="no-data">No wifi data</div>'}
        <div class="sec-lbl" style="margin-top:14px">SIM Recharges</div>
        ${(k.sim||[]).length?(k.sim||[]).map(s=>`<div class="ws-row"><div><div style="font-weight:500">${s.number}</div><div style="font-size:11px;color:#9e9b94">${s.provider}</div></div><div style="display:flex;align-items:center;gap:7px"><span style="font-size:11px;color:#9e9b94">${fD(s.due)}</span>${dueBadge(s.due)}</div></div>`).join(''):'<div class="no-data">No SIM data</div>'}
      </div>
    </div>
  </div>`;

  if(chartInst){chartInst.destroy();chartInst=null;}
  setTimeout(()=>{
    const ctx=document.getElementById('tchart'); if(!ctx)return;
    const fixed=getWifi(k)+getSim(k);
    chartInst=new Chart(ctx,{type:'bar',
      data:{labels:MO,datasets:[
        {label:'Rent',    data:MO.map((_,i)=>getRent(k,i)),backgroundColor:'#2563eb',stack:'s'},
        {label:'Utility', data:MO.map((_,i)=>getUtil(k,i)),backgroundColor:'#059669',stack:'s'},
        {label:'Wifi+SIM',data:MO.map(()=>fixed),backgroundColor:'#7c3aed',stack:'s'},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false},ticks:{font:{size:9},autoSkip:false,maxRotation:0}},
          y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:9},callback:v=>'₹'+(v/1000).toFixed(0)+'k'}}}}
    });
  },60);
}

render();
</script>
